<form id="auth-form-submit" method="post" action="{% url 'ajax_login' %}">
    {% csrf_token %}
    <h2 class="uk-modal-title">Вход в систему</h2>
    <div class="uk-margin">
        {{ form.as_p }}
    </div>
    <div id="auth-errors" class="uk-text-danger uk-margin-small"></div>
    <p class="uk-text-right">
        <button class="uk-button uk-button-default uk-modal-close" type="button">Отмена</button>
        <button class="uk-button uk-button-primary" type="submit">Войти</button>
    </p>
    <p class="uk-text-meta">Нет аккаунта? <a href="#" id="switch-to-register">Зарегистрироваться</a></p>
</form>
